<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SaaS-Inmobiliario</title>
    <script>
      // GitHub Pages no permite reescrituras de URLs (no hay _redirects ni
      // reglas SPA). Esta página captura la ruta solicitada y la reenvía a
      // la app con hash-routing (#/ruta), que sí funciona en Pages.
      var l = window.location
      // La constante BASE se sustituye en el CI al construir (p. ej. "/repo/").
      // El resto del pathname tras la base es la ruta solicitada.
      var base = '__BASE_URL__'
      var prefix = l.pathname.toLowerCase().indexOf(base.toLowerCase())
      var rest = prefix >= 0 ? l.pathname.slice(prefix + base.length) : '/'
      var internal = rest === '' || rest === '/' ? '' : rest
      l.replace(base + '#' + internal + l.search)
    </script>
  </head>
  <body>
    <p>Redirigiendo…</p>
  </body>
</html>
